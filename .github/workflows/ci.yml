name: Swift CI

on:
  push:
  pull_request:

jobs:
  test:
    # Swift tools 6.0 is not available on the macos-14 image's default toolchain.
    # macos-15 ships with Xcode 16 / Swift 6.x.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build release binary
        run: swift build -c release
